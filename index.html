<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>测测你的灵魂对应哪位中国历史人物</title>
<style>
  :root{
    --paper:#f4ecdc;
    --paper-2:#efe4cd;
    --card:#fffaf0;
    --ink:#2b2620;
    --ink-soft:#5c5142;
    --cinnabar:#a8352a;
    --cinnabar-soft:#c25b4f;
    --dai:#35505a;
    --gold:#b8893b;
    --line:#dccfa9;
    --shadow:0 18px 40px rgba(74,58,30,.18);
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 18% 12%, rgba(184,137,59,.14), transparent 42%),
      radial-gradient(circle at 86% 88%, rgba(53,80,90,.16), transparent 46%),
      linear-gradient(160deg,var(--paper) 0%,var(--paper-2) 100%);
    min-height:100%;
    display:flex;
    justify-content:center;
    padding:24px 16px 48px;
  }
  .wrap{width:100%;max-width:640px;}

  /* 背景纹样 */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
    background-image:radial-gradient(var(--ink) 1px, transparent 1px);
    background-size:22px 22px;
  }

  .screen{display:none;animation:fadeIn .5s ease both;}
  .screen.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @keyframes slideNext{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:none;}}
  @keyframes slidePrev{from{opacity:0;transform:translateX(-28px);}to{opacity:1;transform:none;}}
  .anim-next{animation:slideNext .35s ease both;}
  .anim-prev{animation:slidePrev .35s ease both;}

  /* ===== 首页 ===== */
  .hero{
    margin-top:8vh;
    text-align:center;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:46px 30px 38px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"印";position:absolute;right:18px;bottom:14px;
    width:64px;height:64px;border:2px solid var(--cinnabar);border-radius:10px;
    color:var(--cinnabar);font-size:30px;display:flex;align-items:center;justify-content:center;
    opacity:.18;transform:rotate(-8deg);
  }
  .seal{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--cinnabar);letter-spacing:.35em;font-size:13px;margin-bottom:18px;
  }
  .seal::before,.seal::after{content:"";width:26px;height:1px;background:var(--cinnabar);opacity:.5;}
  h1{
    font-size:clamp(26px,6vw,38px);line-height:1.4;letter-spacing:.06em;font-weight:700;
  }
  h1 .accent{color:var(--cinnabar);}
  .sub{
    margin-top:16px;color:var(--ink-soft);font-size:15px;line-height:1.9;
  }
  .tag-row{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .tag{
    border:1px solid var(--line);background:var(--paper);border-radius:999px;
    padding:7px 15px;font-size:13px;color:var(--ink-soft);
  }
  .btn{
    display:inline-block;border:none;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,var(--cinnabar),var(--cinnabar-soft));
    color:#fff;font-size:17px;letter-spacing:.2em;padding:15px 42px;border-radius:999px;
    box-shadow:0 12px 24px rgba(168,53,42,.32);transition:transform .15s ease,box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 28px rgba(168,53,42,.38);}
  .btn:active{transform:translateY(0);}
  .btn-ghost{
    background:transparent;color:var(--dai);border:1px solid var(--dai);
    box-shadow:none;letter-spacing:.15em;
  }
  .home-actions{margin-top:32px;display:flex;flex-direction:column;gap:14px;align-items:center;}
  .disclaimer{margin-top:22px;font-size:12px;color:#9a8d73;line-height:1.8;}

  /* ===== 答题页 ===== */
  .quiz-top{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .q-counter{font-size:14px;color:var(--ink-soft);letter-spacing:.1em;white-space:nowrap;}
  .progress{flex:1;height:8px;background:rgba(120,100,60,.16);border-radius:999px;overflow:hidden;}
  .progress-bar{
    height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--gold),var(--cinnabar));
    transition:width .4s ease;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:30px 26px;
  }
  .q-category{font-size:12px;letter-spacing:.3em;color:var(--gold);margin-bottom:12px;}
  .q-title{font-size:clamp(19px,4.6vw,23px);line-height:1.7;font-weight:700;margin-bottom:26px;}
  .options{display:flex;flex-direction:column;gap:14px;}
  .option{
    text-align:left;font-family:inherit;cursor:pointer;
    background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:17px 18px;font-size:15.5px;line-height:1.7;color:var(--ink);
    display:flex;gap:14px;align-items:flex-start;transition:all .18s ease;
  }
  .option:hover{border-color:var(--gold);background:#fbf3e0;transform:translateX(4px);}
  .option .idx{
    flex:none;width:28px;height:28px;border-radius:8px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dai);
  }
  .option.selected{
    border-color:var(--cinnabar);background:#fbece8;
  }
  .option.selected .idx{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar);}
  .option:disabled{cursor:default;}
  .quiz-foot{margin-top:20px;text-align:center;font-size:12px;color:#9a8d73;}

  /* ===== 结果页 ===== */
  .result-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .result-banner{
    padding:38px 28px 30px;text-align:center;color:#fff;position:relative;
    background:linear-gradient(155deg,var(--dai) 0%,#22383f 100%);
  }
  .result-banner .type{font-size:13px;letter-spacing:.4em;opacity:.85;}
  .result-name{font-size:clamp(32px,8vw,46px);font-weight:700;margin:10px 0 6px;letter-spacing:.08em;}
  .result-era{font-size:14px;opacity:.85;}
  .result-quote{
    margin:20px auto 0;max-width:420px;font-size:16px;line-height:1.9;
    border-top:1px solid rgba(255,255,255,.25);padding-top:18px;
  }
  .result-body{padding:28px 26px;display:flex;flex-direction:column;gap:22px;}
  .block h3{
    font-size:14px;letter-spacing:.25em;color:var(--cinnabar);margin-bottom:10px;
    display:flex;align-items:center;gap:10px;
  }
  .block h3::before{content:"";width:18px;height:1px;background:var(--cinnabar);}
  .block p{font-size:15px;line-height:1.9;color:var(--ink);}
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ink-soft);}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .meta-box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .meta-box .k{font-size:12px;letter-spacing:.2em;color:var(--gold);margin-bottom:8px;}
  .meta-box .v{font-size:14.5px;line-height:1.8;}
  .egg{
    background:#fbf3e0;border:1px dashed var(--gold);border-radius:16px;padding:16px;
    font-size:14px;line-height:1.8;color:var(--ink-soft);
  }
  .result-actions{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .share-tip{text-align:center;font-size:12px;color:#9a8d73;margin-top:14px;line-height:1.8;}

  @media (max-width:480px){
    body{padding:16px 12px 40px;}
    .hero{padding:36px 22px 30px;margin-top:4vh;}
    .card,.result-body{padding:24px 20px;}
    .meta-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 首页 -->
  <section id="home" class="screen active">

    </div>
  </section>

  <!-- 答题页 -->

  <!-- 结果页 -->
  <section id="result" class="screen">
    <div class="result-card">
      <div class="result-banner">
        <div class="type" id="rType"></div>
        <div class="result-name" id="rName"></div>
        <div class="result-era" id="rEra"></div>

        </div>
        <div class="block">
          <h3>为何是 TA</h3>
          <p id="rReason"></p>
        </div>
        <div class="meta-grid">
          <div class="meta-box">
            <div class="k">隐藏优势</div>
            <div class="v" id="rStrength"></div>
          </div>
          <div class="meta-box">
            <div class="k">趣味彩蛋</div>
            <div class="v" id="rEgg"></div>
          </div>
        </div>
        <div class="egg" id="rEggFull"></div>
        <div class="result-actions">
          <button class="btn" id="restartBtn">重新测试</button>
          <button class="btn btn-ghost" id="copyBtn">复制结果文案，去分享</button>
        </div>
        <p class="share-tip">结果页适合截图保存，分享至朋友圈 / 小红书 · 仅供娱乐</p>
      </div>
    </div>
  </section>

</div>

const MAX_POSSIBLE = {"strategist":117,"emperor":77,"scholar":52,"swordsman":37,"poet":66,"general":46,"hermit":85};

const TOTAL = QUESTIONS.length;
let current = 0;
let scores = {};
let answering = false;

const $ = (id) => document.getElementById(id);

function resetState(){
  current = 0;
  scores = Object.fromEntries(Object.keys(PROFILES).map(k => [k, 0]));
  answering = false;
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

function startQuiz(){
  resetState();
  showScreen("quiz");
  renderQuestion("next");
}

function renderQuestion(dir){
  answering = false;
  const item = QUESTIONS[current];
  $("counter").textContent = (current + 1) + " / " + TOTAL;
  $("progressBar").style.width = (current / TOTAL * 100) + "%";
  $("qCategory").textContent = item.cat;
  $("qTitle").textContent = item.q;

  const box = $("options");
  box.innerHTML = "";
  const labels = ["A","B","C","D"];
  item.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = '<span class="idx">' + labels[i] + '</span><span>' + opt.t + '</span>';
    btn.addEventListener("click", () => chooseOption(btn, opt));
    box.appendChild(btn);
  });

  const card = $("quizCard");
  card.classList.remove("anim-next","anim-prev");
  void card.offsetWidth;
  card.classList.add(dir === "prev" ? "anim-prev" : "anim-next");
}

function chooseOption(btn, opt){
  if (answering) return;
  answering = true;
  btn.classList.add("selected");
  Object.entries(opt.s).forEach(([k, v]) => { scores[k] += v; });

  setTimeout(() => {
    if (current < TOTAL - 1){
      current++;
      renderQuestion("next");
    } else {
      $("progressBar").style.width = "100%";
      finish();
    }
  }, 260);
}

function determineResult(){
  // 归一化：得分占该类型理论最大分的比例，消除题目配额不均
  let bestKey = Object.keys(PROFILES)[0];
  let bestRatio = -1;
  Object.keys(PROFILES).forEach(k => {
    const ratio = scores[k] / MAX_POSSIBLE[k];
    if (ratio > bestRatio){ bestRatio = ratio; bestKey = k; }
  });
  return bestKey;
}

function finish(){
  const key = determineResult();
  const p = PROFILES[key];

  $("rType").textContent = p.type;
  $("rName").textContent = p.name;
  $("rEra").textContent = p.era;
  $("rQuote").textContent = "「" + p.quote + "」";
  $("rTraits").innerHTML = p.traits.map(t => '<span class="chip">' + t + '</span>').join("");
  $("rReason").textContent = p.reason;
  $("rStrength").textContent = p.strength;
  $("rEgg").textContent = p.egg;
  $("rEggFull").textContent = "🔍 隐藏彩蛋：" + p.egg;

  window.scrollTo({ top: 0, behavior: "smooth" });
  showScreen("result");
}

function buildShareText(){
  const key = determineResult();
  const p = PROFILES[key];
  return "【灵魂人物测试】\n我对应到的历史人物是：" + p.name + "（" + p.type + "）\n" +
    "性格：" + p.traits.join("、") + "\n" +
    "专属文案：「" + p.quote + "」\n" +
    "快来测测你是哪位历史人物吧～";
}

$("startBtn").addEventListener("click", startQuiz);
$("restartBtn").addEventListener("click", () => { showScreen("home"); });
$("copyBtn").addEventListener("click", async () => {
  const text = buildShareText();
  try {
    await navigator.clipboard.writeText(text);
    $("copyBtn").textContent = "已复制，快去粘贴分享吧";
    setTimeout(() => { $("copyBtn").textContent = "复制结果文案，去分享"; }, 2000);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    $("copyBtn").textContent = "已复制，快去粘贴分享吧";
    setTimeout(() => { $("copyBtn").textContent = "复制结果文案，去分享"; }, 2000);
  }
});
